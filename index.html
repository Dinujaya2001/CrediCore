<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrediCore - Enterprise Bank Loan Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex text-slate-100 bg-slate-950">
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="p-5 flex items-center gap-3 border-b border-slate-800">
                <div
                    class="h-10 w-10 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-950 font-bold text-xl">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">Credi<span class="text-emerald-400">Core</span></h1>
                    <p class="text-xs text-slate-400">Loan Operations Portal</p>
                </div>
            </div>

            <nav class="p-4 space-y-1.5" id="sidebar-nav">
                <button onclick="switchView('dashboard')" id="nav-dashboard"
                    class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl sidebar-link active">
                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                </button>
                <button onclick="switchView('new-app')" id="nav-new-app"
                    class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl sidebar-link text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-plus-circle w-5"></i> New Application
                </button>
                <button onclick="switchView('check-status')" id="nav-check-status"
                    class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl sidebar-link text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-magnifying-glass-dollar w-5"></i> Status Checker
                </button>
                <button onclick="switchView('auth')" id="nav-auth"
                    class="w-full flex items-center gap-3 px-4 py-3 text-sm rounded-xl sidebar-link text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-user-lock w-5"></i> User Portal / Login
                </button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-950 overflow-y-auto">
        <header
            class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 sticky top-0 z-10">
            <h2 id="page-title" class="text-lg font-semibold text-white">Bank Loan Overview Dashboard</h2>
            <button onclick="switchView('new-app')"
                class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Apply Loan
            </button>
        </header>

        <div class="p-6 space-y-8 max-w-7xl w-full mx-auto">
            <div id="alert-container"></div>

            
            <section id="view-dashboard" class="space-y-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="card-dark p-5">
                        <p class="text-xs font-semibold text-slate-400">Total Applications</p>
                        <h3 class="text-3xl font-bold text-white mt-2">1,248</h3>
                    </div>
                    <div class="card-dark p-5">
                        <p class="text-xs font-semibold text-slate-400">Assigned To Me</p>
                        <h3 class="text-3xl font-bold text-emerald-400 mt-2">18</h3>
                    </div>
                </div>
            </section>

            
            <section id="view-new-app" class="hidden space-y-6">
                <div class="card-dark p-8 max-w-4xl mx-auto">
                    <h3 class="text-xl font-bold text-white mb-6">Submit New Loan Application</h3>
                    <form id="form-add-application" onsubmit="handleNewApplication(event)" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text" id="app-fullName" placeholder="Full Name" class="form-input-dark"
                                required>
                            <input type="text" id="app-panCard" placeholder="PAN Card" class="form-input-dark" required>
                            <input type="date" id="app-dob" class="form-input-dark" required>
                            <input type="email" id="app-email" placeholder="Email" class="form-input-dark" required>
                            <input type="tel" id="app-phone" placeholder="Phone Number" class="form-input-dark"
                                required>
                            <input type="number" id="app-customerId" placeholder="Customer ID" class="form-input-dark"
                                required>
                        </div>
                        <input type="text" id="app-address" placeholder="Residential Address / City / Zip"
                            class="form-input-dark" required>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <input type="number" id="app-annualIncome" placeholder="Annual Income"
                                class="form-input-dark" required>
                            <select id="app-employmentStatus" class="form-input-dark">
                                <option value="Employed">Employed</option>
                                <option value="Self-Employed">Self-Employed</option>
                                <option value="Unemployed">Unemployed</option>
                            </select>
                            <input type="number" id="app-creditScore" placeholder="Credit Score" class="form-input-dark"
                                required>
                        </div>
                        <button type="submit"
                            class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl">Submit
                            Application</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

</body>

</html>
